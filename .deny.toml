# cargo-deny: license + source policy for the workspace graph.
# CI: rust-tests.yml `audit` job (`cargo deny check licenses sources`).
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Hidden filename is supported (`deny.toml`, `.deny.toml`, or `.cargo/deny.toml`).

[graph]
# Match what `cargo metadata` sees for this workspace (including examples/xtask).
all-features = false
# Every rustc triple listed under `[package.metadata.buf-tools.targets]` in
# buf-tools/Cargo.toml (not just the CI matrix). Keep in sync when adding a
# target; see AGENTS.md "when adding/removing a target".
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "arm-unknown-linux-gnueabihf",
    "arm-unknown-linux-musleabihf",
    "powerpc64le-unknown-linux-gnu",
    "riscv64gc-unknown-linux-gnu",
    "riscv64-unknown-linux-gnu",
    "s390x-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-pc-windows-gnu",
    "x86_64-unknown-freebsd",
    "aarch64-unknown-freebsd",
    "x86_64-unknown-openbsd",
    "aarch64-unknown-openbsd",
]

[licenses]
# Closed allow-list. Anything else needs a crate-level exception below, not a
# silent expansion of this list.
unused-allowed-license = "allow"
confidence-threshold = 0.8
include-dev = true
allow = [
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Apache-2.0",
    "ISC",
    "Zlib",
]

exceptions = [
    # Mozilla/CCADB CA bundle, pulled in by ureq's default rustls roots.
    # CDLA-Permissive-2.0: redistribute the data with the license text; not copyleft.
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    # Unicode data files shipped with the identifier crate (AND'd with MIT/Apache-2.0).
    { crate = "unicode-ident", allow = ["Unicode-3.0"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
