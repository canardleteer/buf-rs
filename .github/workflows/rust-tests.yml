# -----------------------------------------------------------------------------
# Workspace CI: rustfmt, clippy, tests, buf-tools examples, cargo audit, and
# cargo-deny (licenses + sources).
# Rustfmt/clippy/test/example orchestration lives in .github/ci-scripts/run-examples.sh
# so this file stays mostly declarative. That script sets BUF_EXPECT_VERSION via
# `cargo xtask expected-buf-version` (Buf core from root [workspace.package].version).
# Audit + deny run once in a separate job (same Cargo.lock on every host).
# -----------------------------------------------------------------------------
name: rust-tests

# Run on pushes to main, pull requests targeting main, and manual/dispatched runs.
# workflow_dispatch: use the bump branch as "Run workflow" branch (or `--ref` in gh) so
# status checks attach to the PR head commit; see buf-upstream-watch.yml.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to checkout (optional; defaults to the dispatch branch)
        required: false
        type: string
        default: ""

# Cancel older runs on the same branch when new commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Human-readable job name per matrix row (shown in GitHub UI).
    name: ci (${{ matrix.platform.name }})

    runs-on: ${{ matrix.platform.runs_on }}

    # Use bash everywhere (including windows-2025-vs2026 which will become
    # windows-latest in the future) so .github/ci-scripts/*.sh runs identically.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64 (amd64), Ubuntu latest image.
          - name: linux-amd64
            runs_on: ubuntu-latest
            run_cargo_install_smoke: true

          # Linux ARM64 — hosted runner label per GitHub docs.
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm
            run_cargo_install_smoke: false

          # Optional: enable when Intel macOS capacity is acceptable.
          # - name: macos-amd64
          #   runs_on: macos-13
          #   run_cargo_install_smoke: false

          # Apple Silicon macOS.
          - name: macos-arm64
            runs_on: macos-14
            run_cargo_install_smoke: false

          # Windows x86_64 (Git Bash provides bash for our scripts).
          - name: windows-amd64
            runs_on: windows-2025-vs2026
            run_cargo_install_smoke: false

    env:
      # Shared Buf download cache path for build.rs (matches README CI prewarm pattern).
      BUF_RS_CACHE_DIR: ${{ github.workspace }}/target/buf-rs-cache

    steps:
      # Fetch full git history (default depth is enough for this repo).
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Bootstrap rustup; compiler channel is stable (same as rust-toolchain.toml).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Run fmt check, clippy, workspace tests, then buf_lint + protoc_with_buf_plugins.
      - name: Run workspace CI script
        run: bash .github/ci-scripts/run-examples.sh

      - name: buf-tools cargo-install layout smoke (linux-amd64)
        if: matrix.platform.run_cargo_install_smoke
        run: cargo test -p buf-tools --locked --test cargo_install_layout -- --ignored --test-threads=1

      # Packaging gate: does not upload or consume a crates.io version (no token).
      - name: cargo publish --dry-run (buf-tools, buf-toolchain)
        run: |
          set -euo pipefail
          cargo publish -p buf-tools --dry-run --locked
          cargo publish -p buf-toolchain --dry-run --locked

  audit:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2.9.2
        with:
          # This job does not compile the workspace.
          cache-targets: false
          shared-key: audit

      - name: Cache rustsec advisory-db and audit tools
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/advisory-db
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: audit-tools-${{ runner.os }}-deny0.20.2-audit0.22.2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            audit-tools-${{ runner.os }}-deny0.20.2-audit0.22.2-
            audit-tools-${{ runner.os }}-

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.22.0

      - name: Install cargo-deny and cargo-audit
        run: cargo binstall --no-confirm --disable-strategies compile cargo-deny@0.20.2 cargo-audit@0.22.2

      - name: cargo deny
        run: cargo deny check licenses sources

      - name: cargo audit
        run: cargo audit
