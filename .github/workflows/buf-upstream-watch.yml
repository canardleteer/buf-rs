# =============================================================================
# Buf upstream release monitor — open a PR when bufbuild/buf ships a newer stable
# than our workspace pin (root Cargo.toml / cargo xtask expected-buf-version).
#
# --- GitHub repository settings (do this before pushes + PR creation work) ---
#
# 1) Actions enabled
#    Settings → Actions → General → allow Actions for this repository.
#
# 2) GitHub App so pull_request checks attach
#    Events created with `GITHUB_TOKEN` do not start other workflows. A bump
#    opened as `github-actions[bot]` therefore leaves the main ruleset waiting
#    on `ci (linux-amd64)`, `ci (linux-arm64)`, `ci (macos-arm64)`,
#    `ci (windows-amd64)`, and `rumdl`. `workflow_dispatch` runs do not satisfy
#    those required checks. This job opens the branch and PR with a GitHub App
#    installation token instead.
#    Docs: https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
#    Docs: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/making-authenticated-api-requests-with-a-github-app-in-a-github-actions-workflow
#
#    Configured on this repository:
#      Variable `BUF_UPSTREAM_WATCH_APP_CLIENT_ID`
#      Secret `BUF_UPSTREAM_WATCH_APP_PRIVATE_KEY`
#      App slug `canardleteer-buf-rs-watch` (installed on this repo only)
#    Optional fallback: secret `BUF_UPSTREAM_WATCH_TOKEN` (fine-grained PAT
#    from a collaborator who already has a green `pull_request` run here).
#    Do not use `GITHUB_TOKEN` for push or `gh pr create`.
#    Do not use `pull_request_target`. Do not loosen first-time-contributor /
#    fork workflow approval to paper over missing credentials.
#
#    Recreate the App (personal account; this repo is user-owned):
#    a) https://github.com/settings/apps/new — webhook off; only this account;
#       Contents + Pull requests read/write. Homepage may be this repo URL.
#       Docs: https://docs.github.com/en/apps/creating-github-apps/registering-a-github-app/registering-a-github-app
#       Permissions: https://docs.github.com/en/apps/creating-github-apps/registering-a-github-app/choosing-permissions-for-a-github-app
#    b) gh variable set BUF_UPSTREAM_WATCH_APP_CLIENT_ID --repo OWNER/REPO \
#         --body 'Iv23...'
#       UI: https://github.com/OWNER/REPO/settings/variables/actions
#    c) Generate a private key on the App General page, then:
#         gh secret set BUF_UPSTREAM_WATCH_APP_PRIVATE_KEY --repo OWNER/REPO \
#           < /path/to/app.pem
#       UI: https://github.com/OWNER/REPO/settings/secrets/actions
#    d) Install on this repository only:
#       https://docs.github.com/en/apps/using-github-apps/installing-your-own-github-app
#       Confirm: https://github.com/OWNER/REPO/settings/installations
#    PAT fallback: https://github.com/settings/personal-access-tokens/new
#       (this repo only; Contents + Pull requests read/write), then
#         gh secret set BUF_UPSTREAM_WATCH_TOKEN --repo OWNER/REPO < token-file
#       Docs: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens#creating-a-fine-grained-personal-access-token
#
# 3) Workflow permissions (GITHUB_TOKEN)
#    Read is enough. This workflow uses `GITHUB_TOKEN` only to inspect the repo
#    and list open PRs. The App token (or PAT) performs `git push` and
#    `gh pr create`. Org-level read-only tokens are fine.
#
# 4) Default branch
#    `schedule` only runs workflows from the **default branch**; merge this file
#    there for cron to fire.
#
# 5) repository_dispatch from outside GitHub
#    Callers need a token with access to this repo (e.g. classic PAT `repo`, or
#    fine-grained token with Contents + Metadata). Example:
#    curl -L -X POST -H "Accept: application/vnd.github+json"
#         -H "Authorization: Bearer TOKEN"
#         -d '{"event_type":"buf-release","client_payload":{"version":"1.70.0"}}'
#         https://api.github.com/repos/OWNER/REPO/dispatches
#
# --- Dev crates.io publish from an open bump PR (before merging to main) ---
#
# Use **publish-crates.yml** (manual workflow_dispatch). Set **channel** to **dev**
# and **ref** to the bump branch (e.g. **automated/buf/1.70.0**), not **main**.
# Upload still needs **CRATES_IO_TOKEN** and environment **crates-io-publish**;
# see the header comments in **publish-crates.yml**.
#
# **gh** (workflow file is taken from **main** via **--ref main**; **-f ref=** is the
# checkout ref for the publish jobs):
#   gh workflow run publish-crates.yml --repo OWNER/REPO --ref main \
#     -f channel=dev -f ref=automated/buf/X.Y.Z
#
# The same steps are repeated in each automated bump PR body for convenience.
#
# =============================================================================
name: buf-upstream-watch

on:
  schedule:
    # Every 2 days at 00:00 UTC (day-of-month */2; manual + repository_dispatch unchanged)
    - cron: "0 0 */2 * *"
  workflow_dispatch:
    inputs:
      override_version:
        description: "Optional Buf X.Y.Z (empty = use bufbuild/buf releases/latest)"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [buf-release]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: buf-upstream-watch
  cancel-in-progress: false

jobs:
  maybe-bump:
    name: Check bufbuild/buf and open bump PR
    runs-on: ubuntu-latest
    env:
      BUF_RS_CACHE_DIR: ${{ github.workspace }}/target/buf-rs-cache
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve default branch
        id: default_branch
        run: |
          set -euo pipefail
          name="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.default_branch.outputs.name }}
          fetch-depth: 0
          # Do not persist GITHUB_TOKEN in http.extraheader. That header wins
          # over an App-token push URL and GitHub reports permission denied to
          # github-actions[bot].
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Read optional version hint from event
        id: hint
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              ev = json.load(f)
          name = os.environ["GITHUB_EVENT_NAME"]
          hint = ""
          if name == "workflow_dispatch":
              inp = ev.get("inputs") or {}
              hint = str(inp.get("override_version") or "").strip()
          elif name == "repository_dispatch":
              payload = ev.get("client_payload") or {}
              hint = str(payload.get("version") or "").strip()
          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a", encoding="utf-8") as out:
              out.write("buf_hint<<EOF\n")
              out.write(hint)
              out.write("\nEOF\n")
          PY

      - name: Resolve and validate upstream Buf version
        id: upstream
        run: |
          set -euo pipefail
          HINT="${{ steps.hint.outputs.buf_hint }}"
          if [[ -n "${HINT}" ]]; then
            LATEST="${HINT}"
            bash .github/ci-scripts/buf-validate-buf-release-version.sh "${LATEST}"
          else
            LATEST="$(bash .github/ci-scripts/buf-upstream-latest-stable.sh)"
            bash .github/ci-scripts/buf-validate-buf-release-version.sh "${LATEST}"
          fi
          echo "latest=${LATEST}" >> "${GITHUB_OUTPUT}"

      - name: Compare with workspace pin
        id: compare
        run: |
          set -euo pipefail
          CURRENT="$(cargo xtask expected-buf-version)"
          LATEST="${{ steps.upstream.outputs.latest }}"
          echo "current=${CURRENT}" >> "${GITHUB_OUTPUT}"
          echo "latest=${LATEST}" >> "${GITHUB_OUTPUT}"
          if python3 .github/ci-scripts/bufsemver_upstream_is_newer.py "${CURRENT}" "${LATEST}"; then
            echo "should_bump=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_bump=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Skip summary (already current or upstream not newer)
        if: steps.compare.outputs.should_bump != 'true'
        run: |
          set -euo pipefail
          {
            echo "## Buf upstream watch — no bump"
            echo "- **Workspace Buf core:** \`${{ steps.compare.outputs.current }}\`"
            echo "- **bufbuild/buf latest stable:** \`${{ steps.compare.outputs.latest }}\`"
            echo "- No PR opened (already on or past upstream core)."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub App token
        if: steps.compare.outputs.should_bump == 'true' && vars.BUF_UPSTREAM_WATCH_APP_CLIENT_ID != ''
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.BUF_UPSTREAM_WATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUF_UPSTREAM_WATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Bump, test, push, open PR (or skip if duplicate)
        if: steps.compare.outputs.should_bump == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PAT_TOKEN: ${{ secrets.BUF_UPSTREAM_WATCH_TOKEN }}
        run: |
          set -euo pipefail
          LATEST="${{ steps.upstream.outputs.latest }}"
          BASE="${{ steps.default_branch.outputs.name }}"
          HEAD="automated/buf/${LATEST}"
          CURRENT="${{ steps.compare.outputs.current }}"
          REPO="${GITHUB_REPOSITORY}"

          # `gh pr list --head` takes the branch ref only (`owner:branch` is not supported; see cli/cli#10945).
          count="$(gh pr list --base "${BASE}" --state open --head "${HEAD}" --json number --jq 'length')"
          if [[ "${count}" != "0" ]]; then
            {
              echo "## Buf upstream watch — PR already open"
              echo "Open PR exists for head branch \`${HEAD}\` — not creating another."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ -n "${APP_TOKEN}" ]]; then
            GH_TOKEN="${APP_TOKEN}"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          elif [[ -n "${PAT_TOKEN}" ]]; then
            GH_TOKEN="${PAT_TOKEN}"
            actor_login="$(gh api user --jq .login)"
            actor_id="$(gh api user --jq .id)"
            git config user.name "${actor_login}"
            git config user.email "${actor_id}+${actor_login}@users.noreply.github.com"
          else
            echo "error: missing bump credentials" >&2
            echo "Set repository variable BUF_UPSTREAM_WATCH_APP_CLIENT_ID and secret BUF_UPSTREAM_WATCH_APP_PRIVATE_KEY (preferred)," >&2
            echo "or secret BUF_UPSTREAM_WATCH_TOKEN (fine-grained PAT from a known collaborator)." >&2
            echo "See the header comments in .github/workflows/buf-upstream-watch.yml." >&2
            exit 1
          fi
          export GH_TOKEN

          git checkout -b "${HEAD}"

          cargo xtask workspace set-buf-version "${LATEST}"
          cargo generate-lockfile

          mkdir -p "${BUF_RS_CACHE_DIR}"
          export BUF_EXPECT_VERSION="$(cargo xtask expected-buf-version)"
          echo "Expected Buf Version: ${BUF_EXPECT_VERSION}"
          cargo xtask check

          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump Buf pin to ${LATEST}"

          git config --unset-all http.https://github.com/.extraheader || true
          git push --force-with-lease "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${HEAD}"

          BODY_FILE="$(mktemp)"
          trap 'rm -f "${BODY_FILE}"' EXIT
          export BUMP_BODY_FILE="${BODY_FILE}"
          export BUMP_LATEST="${LATEST}"
          export BUMP_CURRENT="${CURRENT}"
          export BUMP_BASE="${BASE}"
          export BUMP_HEAD="${HEAD}"
          export BUMP_REPO="${REPO}"
          python3 << 'PY'
          import os
          import textwrap
          from pathlib import Path

          latest = os.environ["BUMP_LATEST"]
          current = os.environ["BUMP_CURRENT"]
          base = os.environ["BUMP_BASE"]
          head = os.environ["BUMP_HEAD"]
          repo = os.environ["BUMP_REPO"]
          path = Path(os.environ["BUMP_BODY_FILE"])
          body = textwrap.dedent(
              f"""
              Automated bump: workspace Buf core **{current}** → **{latest}** to match [bufbuild/buf v{latest}](https://github.com/bufbuild/buf/releases/tag/v{latest}).

              - [ ] Review changelog / breaking changes upstream
              - [ ] Merge when CI is green, or try a **dev** publish first (below)

              Required checks (`ci (linux-amd64)`, `ci (linux-arm64)`, `ci (macos-arm64)`, `ci (windows-amd64)`, `rumdl`) come from `pull_request` workflows. This PR is opened with the watch GitHub App so those runs attach. `workflow_dispatch` does not satisfy the ruleset.

              ### Try a dev crates.io publish (without merging to `{base}`)

              Uses [publish-crates.yml](https://github.com/{repo}/actions/workflows/publish-crates.yml): **channel** `dev`, **ref** this branch (`{head}`). Requires `CRATES_IO_TOKEN` and environment **crates-io-publish** as in AGENTS.md.

              **Actions UI:** **Actions** → **publish-crates** → **Run workflow** → `channel`: `dev` → `ref`: `{head}`

              **CLI:**
              ```bash
              gh workflow run publish-crates.yml --repo {repo} --ref {base} -f channel=dev -f ref={head}
              ```
              (`--ref {base}` selects the workflow definition from the default branch; `-f ref=` is the checkout ref for the publish job.)

              ### repository_dispatch

              External automation can trigger this workflow with `event_type: buf-release` and optional `client_payload.version` (plain `X.Y.Z`).
              """
          ).strip()
          path.write_text(body, encoding="utf-8")
          PY

          if pr_out="$(gh pr create \
            --base "${BASE}" \
            --head "${HEAD}" \
            --title "chore: bump Buf pin to ${LATEST}" \
            --body-file "${BODY_FILE}" 2>&1)"; then
            :
          elif [[ "${pr_out}" == *"already exists"* ]]; then
            {
              echo "## Buf upstream watch — PR already open"
              echo "Branch \`${HEAD}\` is up to date on the remote; an open PR into \`${BASE}\` already exists (race or transient \`gh pr list\` mismatch)."
              echo "${pr_out}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          else
            printf '%s\n' "${pr_out}" >&2
            exit 1
          fi

          {
            echo "## Buf upstream watch — opened PR"
            echo "- **${CURRENT}** → **${LATEST}**"
            echo "- Branch: \`${HEAD}\`"
            echo "- Opened with a GitHub App or collaborator PAT so \`pull_request\` rust-tests and rumdl attach as required checks."
          } >> "${GITHUB_STEP_SUMMARY}"
