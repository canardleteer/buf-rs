# -----------------------------------------------------------------------------
# Markdown hygiene (rumdl) on pull requests targeting main.
# Always runs (no path filters) so the required `rumdl` status check reports on
# every PR; otherwise Cargo-only bumps stay blocked waiting for the check.
# Config: .rumdl.toml at repo root. Does not run on push (PR gate only).
# -----------------------------------------------------------------------------
name: Markdown Hygiene

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rumdl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: rvben/rumdl@v0
        with:
          config: .rumdl.toml
