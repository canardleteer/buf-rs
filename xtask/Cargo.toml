[package]
name = "xtask"
description = "Workspace development and maintainer tasks (check, coverage, publish helpers, Buf pin)."
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
fastrand = "2"
log = "0.4"
semver = "1"
toml_edit = "0.25"

[dev-dependencies]
temp-env = "0.3"
