[package]
name = "buf-toolchain"
description = "Installer for official Buf CLI binaries pinned by crate semver."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish.workspace = true

include = [
    "Cargo.toml",
    "README.md",
    "src/**/*.rs",
    "build.rs",
    "build_support/**/*.rs",
]

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "validate-cargo-buf-toolchain"
path = "src/main.rs"
required-features = ["validate-cli"]

[features]
# Empty default: `cargo add buf-toolchain` / [build-dependencies] do not pull
# clap or noyalib. `cargo install` enables required-features on this bin.
validate-cli = ["dep:clap", "dep:noyalib", "dep:serde"]

[dependencies]
hex = "0.4"
minisign-verify = "0.2.5"
regex = "1"
semver = "1"
serde_json = "1"
sha2 = "0.11"
ureq = "3"
rustls.workspace = true
clap = { version = "4.6", features = ["derive"], optional = true }
noyalib = { version = "0.0.44", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
hex = "0.4"
semver = "1"
sha2 = "0.11"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[build-dependencies]
flate2 = "1"
hex = "0.4"
minisign-verify = "0.2.5"
semver = "1"
sha2 = "0.11"
tar = "0.4"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
ureq = "3"
rustls.workspace = true
