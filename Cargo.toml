[workspace]
resolver = "2"
members = [
    "examples",
    "buf-tools",
    "buf-toolchain",
    "xtask",
]

[workspace.package]
version = "1.72.0"
edition = "2024"
license = "MIT"
authors = ["canardleteer <eris.has.a.dad+github@gmail.com>"]
repository = "https://github.com/canardleteer/buf-rs"
homepage = "https://github.com/canardleteer/buf-rs"
readme = "README.md"
keywords = ["buf", "protoc", "protobuf", "vendored", "cli"]
categories = ["development-tools", "api-bindings"]
publish = true

[workspace.dependencies]
buf-tools = { path = "buf-tools", version = "=1.72.0" }
buf-toolchain = { path = "buf-toolchain", version = "=1.72.0" }
# ureq 3 pulls rustls transitively. Official fix for RUSTSEC-2026-0285 (0.23.44): >=0.23.45.
# default-features = false + ring matches ureq's rustls feature (avoids aws-lc-sys).
rustls = { version = ">=0.23.45", default-features = false, features = ["logging", "std", "tls12", "ring"] }
